name: tamam
description: "A local-first, privacy-respecting task manager."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.18.0
  drift: ^2.20.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.0
  riverpod_annotation: ^2.6.1
  rrule: ^0.2.16
  sqlite3_flutter_libs: ^0.5.0
  table_calendar: ^3.1.0
  timezone: ^0.9.0
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.0
  riverpod_generator: ^2.6.1
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
